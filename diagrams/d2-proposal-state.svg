<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ParkOps proposal state diagram</title>
  <desc id="desc">A proposal starts pending, can be rejected or approved, and ends stale or executed after checks. Repeated execution returns duplicate without changing state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#42536b"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#182338}.title{font-size:29px;font-weight:700}.subtitle{font-size:15px;fill:#526078}
      .state{stroke-width:2}.stateName{font-size:20px;font-weight:700;text-anchor:middle}.stateNote{font-size:13px;text-anchor:middle}
      .transition{fill:none;stroke:#42536b;stroke-width:2;marker-end:url(#arrow)}.label{font-size:14px;fill:#34445d}
      .card{fill:#f8fafc;stroke:#d3dce8;stroke-width:1.3}.cardtitle{font-size:15px;font-weight:700;fill:#263b5a}.cardtext{font-size:14px;fill:#34445d}
      .dot{fill:#263b5a}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f4f7fb"/>
  <text x="48" y="52" class="title">ParkOps — Proposal lifecycle</text>
  <text x="48" y="80" class="subtitle">The operator chooses; Java checks current data before the booking changes.</text>

  <!-- initial node -->
  <circle cx="82" cy="248" r="9" class="dot"/>
  <path d="M91 248 H167" class="transition"/>

  <!-- state nodes -->
  <rect x="170" y="208" width="210" height="82" rx="20" fill="#e8f1ff" stroke="#4776b8" class="state"/>
  <text x="275" y="242" class="stateName">PENDING</text><text x="275" y="266" class="stateNote">proposal created</text>

  <rect x="490" y="105" width="220" height="82" rx="20" fill="#e8f7ee" stroke="#3b8b5a" class="state"/>
  <text x="600" y="139" class="stateName">APPROVED</text><text x="600" y="163" class="stateNote">operator says yes</text>

  <rect x="490" y="330" width="220" height="82" rx="20" fill="#fff0e9" stroke="#c56c43" class="state"/>
  <text x="600" y="364" class="stateName">REJECTED</text><text x="600" y="388" class="stateNote">terminal; booking unchanged</text>

  <rect x="825" y="105" width="220" height="82" rx="20" fill="#fff6dd" stroke="#c59a34" class="state"/>
  <text x="935" y="139" class="stateName">STALE</text><text x="935" y="163" class="stateNote">terminal; checks failed</text>

  <rect x="825" y="330" width="220" height="82" rx="20" fill="#e7f6f5" stroke="#398b87" class="state"/>
  <text x="935" y="364" class="stateName">EXECUTED</text><text x="935" y="388" class="stateNote">booking updated once</text>

  <!-- transitions -->
  <path d="M380 220 C430 195 445 165 490 151" class="transition"/>
  <text x="386" y="181" class="label">operator says yes</text>

  <path d="M380 277 C430 300 445 347 490 360" class="transition"/>
  <text x="387" y="324" class="label">operator says no</text>

  <path d="M710 145 H825" class="transition"/>
  <text x="718" y="132" class="label">execution recheck fails</text>

  <path d="M710 167 C760 198 786 287 848 331" class="transition"/>
  <text x="720" y="261" class="label">rechecks pass / reassign + notify once</text>

  <!-- duplicate self-loop -->
  <path d="M1038 342 C1132 305 1138 431 1038 400" class="transition"/>
  <text x="835" y="440" class="label">Repeat request → DUPLICATE; no changes</text>

  <!-- legend cards -->
  <rect x="170" y="505" width="430" height="132" rx="10" class="card"/>
  <text x="195" y="537" class="cardtitle">What the states mean</text>
  <text x="195" y="566" class="cardtext">PENDING waits for an operator. APPROVED is an internal step</text>
  <text x="195" y="589" class="cardtext">before the guarded update. REJECTED and STALE end without</text>
  <text x="195" y="612" class="cardtext">changing the booking. EXECUTED means the update completed.</text>

  <rect x="630" y="505" width="415" height="132" rx="10" class="card"/>
  <text x="655" y="537" class="cardtitle">Outcome labels are not proposal states</text>
  <text x="655" y="566" class="cardtext">COMMITTED reports a successful transition to EXECUTED.</text>
  <text x="655" y="589" class="cardtext">DUPLICATE reports a repeated request for an EXECUTED</text>
  <text x="655" y="612" class="cardtext">proposal; it does not create a new transition.</text>
</svg>
